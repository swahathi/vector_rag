[server]
# Streamlit Community Cloud reverse proxies cap uploads at 200 MB.
# Setting this to 10 GB causes Cloudflare/Nginx timeouts and Starlette ClientDisconnect errors.
maxUploadSize = 200        # MB – per-file upload cap (matches CONFIG.max_total_mb)
maxMessageSize = 200       # MB – total WebSocket payload cap

[browser]
# Suppresses the "Are you sure you want to leave?" dialog during long runs
gatherUsageStats = false
